name: Test Supabase -> Lark
on:
  push:
    branches: [claude/fix-supabase-pooler-host]
    paths: ['.github/workflows/test-lark.yml', 'integrations/sync/lark-sync.mjs']
  workflow_dispatch:
jobs:
  lark:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: gkmall-store.myshopify.com
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
      LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
      LARK_TABLE_REPORT: ${{ secrets.LARK_TABLE_REPORT }}
      LARK_TABLE_APPROVALS: ${{ secrets.LARK_TABLE_APPROVALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev
      - run: npm run sync:lark -- pull-approvals
      - run: npm run apply:approved
      - run: npm run sync:lark -- push-requests
      - run: npm run sync:lark -- push-report
